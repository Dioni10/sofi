<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amor - Lirios del Valle Amarillos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #1e1b2e 0%, #0d0b14 100%);
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(253, 224, 71, 0.4)); }
            50% { filter: drop-shadow(0 0 30px rgba(253, 224, 71, 0.8)); }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes float-up {
            0% {
                transform: translateY(0px) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-300px) scale(1.3) rotate(calc(var(--rot) * 1deg));
                opacity: 0;
            }
        }
        @keyframes heart-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
        .glow-effect {
            animation: pulse-glow 4s ease-in-out infinite;
        }
        .sparkle-dot {
            animation: sparkle 3s ease-in-out infinite;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(253, 224, 71, 0.2);
        }
        .pop-animation {
            animation: heart-pop 0.3s ease-in-out;
        }
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: float-up 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 relative">

    <!-- Elemento de audio oculto (reemplaza el src con tu enlace o archivo de música) -->
    <audio id="bg-music" loop>
        <source src="R.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <div id="particles-container" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <header class="z-10 text-center mt-4 sm:mt-6">
        <span class="inline-block px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-amber-500/10 text-amber-300 border border-amber-500/30 mb-2 tracking-wide uppercase">
            A la distancia, pero siempre juntos
        </span>
        <h1 class="romantic-font text-4xl sm:text-6xl text-amber-200 font-bold tracking-wide drop-shadow-md">
            Lirios de Valle para Ti
        </h1>
    </header>

    <main class="z-10 flex flex-col items-center justify-center my-6 w-full max-w-lg">
        <div class="glass-card rounded-3xl p-6 sm:p-8 w-full shadow-2xl relative flex flex-col items-center glow-effect">
            
            <!-- SVG LILY OF THE VALLEY BOUQUET -->
            <div class="w-full h-72 sm:h-80 flex items-center justify-center relative float-anim">
                <svg viewBox="0 0 400 400" class="w-full h-full drop-shadow-lg" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ribbon tying stems -->
                    <path d="M185 270 Q200 280 215 270 Q210 295 190 295 Z" fill="#eab308" opacity="0.9"/>
                    <path d="M175 275 Q200 260 225 275 Q230 260 210 250 Q200 265 190 250 Z" fill="#ca8a04"/>

                    <!-- Stems & Leaves -->
                    <path d="M200 350 Q180 250 200 120" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M195 240 Q150 200 120 220 Q100 240 130 290 Q160 300 195 270" fill="#16a34a" opacity="0.8"/>
                    <path d="M205 260 Q250 210 280 235 Q300 265 270 310 Q235 315 205 285" fill="#15803d" opacity="0.85"/>
                    <path d="M200 200 Q240 160 230 110" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M200 160 Q160 120 170 80" stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round"/>

                    <!-- Yellow Bell Blossoms (Lily of the Valley) -->
                    <!-- Branch 1 (Left) -->
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M170 80 Q160 75 155 85 Q150 95 160 100 Z" fill="#fef08a"/>
                        <ellipse cx="157" cy="95" rx="8" ry="6" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M180 100 Q170 95 165 105 Q160 115 170 120 Z" fill="#fef08a"/>
                        <ellipse cx="167" cy="115" rx="8" ry="6" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M190 125 Q180 120 175 130 Q170 140 180 145 Z" fill="#fef08a"/>
                        <ellipse cx="177" cy="140" rx="8" ry="6" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>

                    <!-- Branch 2 (Center Main) -->
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M200 120 Q190 115 185 125 Q180 135 190 140 Z" fill="#fef08a"/>
                        <ellipse cx="187" cy="135" rx="9" ry="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M200 145 Q215 140 220 150 Q225 160 210 165 Z" fill="#fef08a"/>
                        <ellipse cx="213" cy="160" rx="9" ry="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M200 170 Q185 165 180 175 Q175 185 190 190 Z" fill="#fef08a"/>
                        <ellipse cx="187" cy="185" rx="9" ry="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M200 195 Q215 190 220 200 Q225 210 210 215 Z" fill="#fef08a"/>
                        <ellipse cx="213" cy="210" rx="9" ry="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>

                    <!-- Branch 3 (Right) -->
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M230 110 Q240 105 245 115 Q250 125 240 130 Z" fill="#fef08a"/>
                        <ellipse cx="243" cy="125" rx="8" ry="6" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>
                    <g class="transition-transform duration-500 hover:scale-110 origin-center cursor-pointer">
                        <path d="M220 135 Q235 130 240 140 Q245 150 230 155 Z" fill="#fef08a"/>
                        <ellipse cx="233" cy="150" rx="8" ry="6" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
                    </g>
                </svg>
            </div>

            <div class="text-center mt-2 w-full">
                <p class="text-amber-100/90 text-sm sm:text-base italic px-2 leading-relaxed font-light mb-6">
                    "Aunque los kilómetros nos separen, mi amor por ti florece cada día más brillante. Toca el corazón tantas veces como me extrañes y me ames ❤️❤️."
                </p>
                
                <!-- INSTAGRAM STYLE HEART & COUNTER SECTION -->
                <div class="flex flex-col items-center justify-center relative" id="heart-section">
                    <button id="like-button" onclick="handleHeartClick(event)" aria-label="Enviar amor" class="relative group p-4 rounded-full bg-gradient-to-tr from-amber-500/20 to-yellow-400/20 border border-amber-400/40 shadow-xl hover:bg-amber-500/30 transition-transform active:scale-95 focus:outline-none">
                        <svg id="heart-icon" class="w-12 h-12 sm:w-14 sm:h-14 text-yellow-400 drop-shadow-[0_0_12px_rgba(250,204,21,0.6)] transition-transform duration-200" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                    
                    <div class="mt-3 flex items-center gap-2 bg-slate-900/60 px-4 py-1.5 rounded-full border border-amber-500/20 shadow-inner">
                        <span class="text-xs uppercase tracking-wider text-amber-300/80 font-medium">Amor enviado:</span>
                        <span id="like-counter" class="text-amber-300 font-bold text-base sm:text-lg">0</span>
                        <span class="text-amber-400">💛</span>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <footer class="z-10 text-center text-xs text-amber-200/50 pb-2">
        Hecho con todo el corazón para la distancia · Tus flores favoritas
    </footer>

    <script>
        let likeCount = 0;

        function handleHeartClick(event) {
            likeCount++;
            document.getElementById('like-counter').innerText = likeCount;

            // Reproducir o pausar la música al hacer clic en el corazón
            const music = document.getElementById('bg-music');
            if (music.paused) {
                music.play().catch(error => console.log("Reproducción bloqueada por el navegador:", error));
            }

            // Trigger heart pop animation on button icon
            const heartIcon = document.getElementById('heart-icon');
            heartIcon.classList.remove('pop-animation');
            void heartIcon.offsetWidth; // trigger reflow
            heartIcon.classList.add('pop-animation');

            // Generate floating Instagram-like hearts around click coordinate or button
            createFloatingHeart(event);
        }

        function createFloatingHeart(event) {
            const heartSection = document.getElementById('heart-section');
            const rect = heartSection.getBoundingClientRect();
            
            // Generate 1 to 3 hearts per click for rich interaction
            const count = Math.floor(Math.random() * 2) + 2;
            
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                
                // Random variation in heart color (golds, yellows, bright amber)
                const colors = ['#fde047', '#facc15', '#fef08a', '#fbbf24', '#f59e0b'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                heart.innerHTML = `<svg width="${Math.floor(Math.random() * 16) + 22}" height="${Math.floor(Math.random() * 16) + 22}" viewBox="0 0 24 24" fill="${randomColor}" style="filter: drop-shadow(0 0 6px rgba(253, 224, 71, 0.7));">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>`;

                // Position relative to heart section center with random spread
                const offsetX = (Math.random() - 0.5) * 80;
                const offsetY = (Math.random() - 0.2) * 20;
                
                heart.style.left = `calc(50% + ${offsetX}px)`;
                heart.style.bottom = `40px`;
                
                // Random rotation angle for CSS variable
                const rot = (Math.random() - 0.5) * 60;
                heart.style.setProperty('--rot', rot);
                
                // Append to heart container section
                heartSection.appendChild(heart);

                // Remove after animation completes
                setTimeout(() => {
                    heart.remove();
                }, 1800);
            }
        }

        // Generate background starry sparkles
        function createParticles() {
            const container = document.getElementById('particles-container');
            const count = 25;
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'absolute rounded-full sparkle-dot bg-amber-200';
                const size = Math.random() * 3 + 1;
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';
                dot.style.left = Math.random() * 100 + '%';
                dot.style.top = Math.random() * 100 + '%';
                dot.style.animationDelay = (Math.random() * 3) + 's';
                dot.style.animationDuration = (Math.random() * 3 + 2) + 's';
                container.appendChild(dot);
            }
        }

        window.onload = createParticles;
    </script>
</body>
</html>
